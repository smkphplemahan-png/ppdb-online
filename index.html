<!DOCTYPE html>
<html>
<head>
  <title>PPDB SMK PH</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial;
      background: #eef5f1;
    }

    .container {
      max-width: 420px;
      margin: 40px auto;
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      color: #0a7d3b;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 12px;
      background: #0a7d3b;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      background: gray;
    }

    .loading {
      text-align: center;
      margin-top: 10px;
      display: none;
      color: #555;
    }
  </style>
</head>

<body>

<div class="container">
  <h2>Form Pendaftaran</h2>

  <form id="form">
    <input name="nama" placeholder="Nama" required>
    <input name="tempat" placeholder="Tempat Lahir" required>
    <input type="date" name="tanggal" required>
    <input name="nisn" placeholder="NISN" required>
    <input name="nik" placeholder="NIK" required>
    <input name="sekolah" placeholder="Asal Sekolah" required>
    <input name="wa" placeholder="No WA" required>

    <select name="jurusan">
      <option>Teknik Sepeda Motor</option>
      <option>Teknik Ketenagalistrikan</option>
      <option>Manajemen Perkantoran</option>
    </select>

    <input type="file" name="foto" accept="image/*" required>

    <button type="submit" id="btn">Daftar</button>
  </form>

  <div class="loading" id="loading">⏳ Mengirim data...</div>
</div>

<script>
const form = document.getElementById("form");
const loading = document.getElementById("loading");
const btn = document.getElementById("btn");

form.addEventListener("submit", (e) => {
  e.preventDefault();

  const formData = new FormData(form);
  const file = formData.get("foto");

  if (!file) {
    alert("Foto wajib diisi!");
    return;
  }

  loading.style.display = "block";
  btn.disabled = true;

  const reader = new FileReader();

  reader.onload = async function () {

    const base64 = reader.result;

    const data = {
      nama: formData.get("nama"),
      tempat: formData.get("tempat"),
      tanggal: formData.get("tanggal"),
      nisn: formData.get("nisn"),
      nik: formData.get("nik"),
      sekolah: formData.get("sekolah"),
      wa: formData.get("wa"),
      jurusan: formData.get("jurusan"),
      foto: base64
    };

    try {
      const res = await fetch("/api/daftar", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
      });

      const result = await res.json();

      loading.style.display = "none";
      btn.disabled = false;

      if (result.status === "ok") {
        alert("✅ Pendaftaran berhasil!\nCek WhatsApp Anda");
        form.reset();
      } else {
        alert("❌ Gagal: " + (result.error || "unknown"));
      }

    } catch (err) {
      loading.style.display = "none";
      btn.disabled = false;
      alert("❌ Server error");
    }
  };

  reader.readAsDataURL(file);
});
</script>

</body>
</html>
