<!DOCTYPE html>
<html>
<head>
  <title>Kartu PPDB</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial;
      background: #eef5f1;
      text-align: center;
    }

    .card {
      width: 350px;
      margin: 40px auto;
      padding: 20px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h2 {
      color: #0a7d3b;
    }

    .item {
      text-align: left;
      margin-top: 10px;
    }

    .label {
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="card">
  <h2>Kartu Peserta PPDB</h2>

  <div class="item"><span class="label">No:</span> <span id="nomor"></span></div>
  <div class="item"><span class="label">Nama:</span> <span id="nama"></span></div>
  <div class="item"><span class="label">TTL:</span> <span id="ttl"></span></div>
  <div class="item"><span class="label">NISN:</span> <span id="nisn"></span></div>
  <div class="item"><span class="label">NIK:</span> <span id="nik"></span></div>
  <div class="item"><span class="label">Sekolah:</span> <span id="sekolah"></span></div>
  <div class="item"><span class="label">Jurusan:</span> <span id="jurusan"></span></div>
</div>

<script>
const url = new URLSearchParams(window.location.search);

document.getElementById("nomor").innerText = url.get("nomor");
document.getElementById("nama").innerText = url.get("nama");
document.getElementById("ttl").innerText = url.get("ttl");
document.getElementById("nisn").innerText = url.get("nisn");
document.getElementById("nik").innerText = url.get("nik");
document.getElementById("sekolah").innerText = url.get("sekolah");
document.getElementById("jurusan").innerText = url.get("jurusan");
</script>

</body>
</html>
